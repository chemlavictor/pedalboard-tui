# .specs/config.yaml — project-wide spec workflow config (free-form, agent-interpreted)
project:
  goal: "Terminal Distortion Pedal (TDP) — chaîne de pédales audio temps réel en C11, pilotée par CLI/shell de commandes."
  tech_stack:
    - "C11 (GCC/Clang, atomics)"
    - "PortAudio (audio temps réel)"
    - "ncurses (V1 TUI, à remplacer par CLI)"
    - "WAV (enregistrement, encodeur maison)"

principles:
  tdd: false
  no_comments: false
  rt_constraints: "Le callback audio n'utilise ni malloc/free, ni I/O, ni locks. stdatomic seulement."
  ui_style: "CLI shell de commandes (prompt tdp>), pas de TUI. Compatible Windows + Linux."

hooks:
  after_task:
    - command: "make test"
      auto: false
