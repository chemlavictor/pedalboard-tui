<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPD — Terminal Pedal Board</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #0f0;
      padding: 20px;
    }
    h1 { color: #0f0; margin-bottom: 10px; font-size: 1.5em; }
    .subtitle { color: #888; margin-bottom: 15px; font-size: 0.9em; }
    #vu {
      background: #000;
      border: 1px solid #0f0;
      padding: 10px;
      margin-bottom: 15px;
      font-size: 0.9em;
      min-height: 40px;
    }
    .vu-bar {
      display: inline-block;
      width: 200px;
      height: 16px;
      background: #222;
      border: 1px solid #0f0;
      vertical-align: middle;
      margin: 0 8px;
    }
    .vu-fill {
      height: 100%;
      background: #0f0;
      width: 0%;
      transition: width 0.1s;
    }
    #output {
      background: #000;
      border: 1px solid #0f0;
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-size: 0.9em;
      margin-bottom: 15px;
    }
    .input-row { display: flex; align-items: center; }
    .prompt { color: #0f0; font-weight: bold; margin-right: 5px; }
    #cmd {
      flex: 1;
      background: #000;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 10px;
      font-family: inherit;
      font-size: 1em;
    }
    #cmd:focus { outline: none; border-color: #0f0; }
    .history { margin-top: 15px; color: #888; font-size: 0.8em; }
    .history span { color: #0f0; cursor: pointer; margin-right: 10px; }
    .history span:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>TPD — Terminal Pedal Board</h1>
  <div class="subtitle">Shell web — VU temps réel + commandes</div>

  <div id="vu">
    VU in : <span class="vu-bar"><span class="vu-fill" id="vu-in"></span></span> <span id="vu-in-val">0%</span>
    &nbsp;&nbsp;
    VU out : <span class="vu-bar"><span class="vu-fill" id="vu-out"></span></span> <span id="vu-out-val">0%</span>
  </div>

  <div id="output">TPD Web — tape une commande ci-dessous (ex: help, pedals, load son_metal.tdp, start)</div>

  <div class="input-row">
    <span class="prompt">tdp&gt;</span>
    <input type="text" id="cmd" placeholder="tape une commande" autocomplete="off">
  </div>

  <div class="history" id="history"></div>

  <script>
    const output = document.getElementById("output");
    const cmdInput = document.getElementById("cmd");
    const historyDiv = document.getElementById("history");
    const vuIn = document.getElementById("vu-in");
    const vuOut = document.getElementById("vu-out");
    const vuInVal = document.getElementById("vu-in-val");
    const vuOutVal = document.getElementById("vu-out-val");
    let history = [];
    let histIndex = -1;

    function appendOutput(text) {
      output.textContent += "\n" + text;
      output.scrollTop = output.scrollHeight;
    }

    async function sendCmd(cmd) {
      if (!cmd) return;
      appendOutput("tdp> " + cmd);
      if (history[history.length - 1] !== cmd) {
        history.push(cmd);
        if (history.length > 32) history.shift();
        renderHistory();
      }
      histIndex = -1;
      try {
        const resp = await fetch("/cmd", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cmd: cmd }),
        });
        const data = await resp.json();
        appendOutput(data.output || "(pas de sortie)");
      } catch (e) {
        appendOutput("(erreur : " + e.message + ")");
      }
    }

    function renderHistory() {
      historyDiv.innerHTML = "historique : " + history
        .slice(-8)
        .map(c => `<span onclick="cmdInput.value='${c.replace(/'/g, "\\'")}'">${c}</span>`)
        .join("");
    }

    cmdInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const cmd = cmdInput.value.trim();
        cmdInput.value = "";
        sendCmd(cmd);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (history.length > 0) {
          if (histIndex === -1) histIndex = history.length - 1;
          else if (histIndex > 0) histIndex--;
          cmdInput.value = history[histIndex];
        }
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        if (histIndex !== -1) {
          if (histIndex < history.length - 1) histIndex++;
          else { histIndex = -1; cmdInput.value = ""; }
          if (histIndex !== -1) cmdInput.value = history[histIndex];
        }
      }
    });

    /* Poll le VU (status) toutes les 500 ms. */
    async function pollVU() {
      try {
        const resp = await fetch("/cmd", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cmd: "status" }),
        });
        const data = await resp.json();
        // Parse la sortie (ex: "in : -12.3 dB  peak -8.1 dB").
        // Simplifie : on extrait les nombres.
        const text = data.output || "";
        const inMatch = text.match(/in\s*:\s*([-\d.]+)/);
        const outMatch = text.match(/out\s*:\s*([-\d.]+)/);
        if (inMatch) {
          // Converti dB en % (0 dB = 100%, -60 dB = 0%).
          const db = parseFloat(inMatch[1]);
          const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
          vuIn.style.width = pct + "%";
          vuInVal.textContent = Math.round(pct) + "%";
        }
        if (outMatch) {
          const db = parseFloat(outMatch[1]);
          const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
          vuOut.style.width = pct + "%";
          vuOutVal.textContent = Math.round(pct) + "%";
        }
      } catch (e) {
        // Ignore les erreurs de poll.
      }
    }
    setInterval(pollVU, 500);

    // Verifie que le serveur est en ligne.
    fetch("/status")
      .then(r => r.json())
      .then(d => {
        if (!d.connected) {
          appendOutput("ATTENTION : serveur TPD non connecte.");
        }
      })
      .catch(() => {
        appendOutput("ATTENTION : serveur TPD injoignable.");
      });
  </script>
</body>
</html>
